services:
  # 1. React Frontend Static Site
  - type: web
    name: abhijit-portfolio-frontend
    env: static
    region: singapore
    buildCommand: npm install && npm run build
    staticPublishPath: .output/public
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: abhijit-portfolio-api
          property: url
          postfix: /api

  # 2. Express.js Backend API Service
  - type: web
    name: abhijit-portfolio-api
    env: node
    region: singapore
    plan: starter
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: OWNER_EMAIL
        value: abhijitskv3@gmail.com
      - key: MYSQL_HOST
        fromDatabase:
          name: portfolio-mysql-db
          property: host
      - key: MYSQL_PORT
        fromDatabase:
          name: portfolio-mysql-db
          property: port
      - key: MYSQL_DATABASE
        fromDatabase:
          name: portfolio-mysql-db
          property: database
      - key: MYSQL_USER
        fromDatabase:
          name: portfolio-mysql-db
          property: user
      - key: MYSQL_PASSWORD
        fromDatabase:
          name: portfolio-mysql-db
          property: password

databases:
  # 3. Managed MySQL Database
  - name: portfolio-mysql-db
    databaseName: portfolio_db
    user: portfolio_user
    plan: starter
